services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: silknode
      POSTGRES_PASSWORD: silknode
      POSTGRES_DB: silknode_support
    ports:
      - "5432:5432"
    volumes:
      - silknode_postgres_data:/var/lib/postgresql/data

volumes:
  silknode_postgres_data:
